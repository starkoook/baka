appId: com.bakatools.app
productName: Baka TOOLS
electronDist: node_modules/electron/dist
directories:
  output: release
  buildResources: public
files:
  - dist/**/*
  - electron/**/*.js
  - electron/**/*.py
  - electron/skills/*.md
  - electron/skills/*.txt
  - package.json
  - THIRD_PARTY_NOTICES.md
asarUnpack:
  - electron/ipc/tagger-worker.js
  - electron/ipc/tagger-layout.js
  - electron/ipc/tag-catalog.js
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: licenses/AGPL-3.0.txt
    to: licenses/AGPL-3.0.txt
  - from: resources/component-source.json
    to: component-source.json
win:
  # 只出免安装版：解压到任意文件夹，运行 Baka TOOLS.exe，数据放在旁边的 BakaTOOLS-data
  target:
    - zip
  icon: public/icon.png
  signAndEditExecutable: false
  artifactName: Baka-TOOLS-Portable.${ext}
extraMetadata:
  name: baka-tools