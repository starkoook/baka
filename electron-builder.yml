appId: com.bakatools.app
productName: Baka TOOLS
directories:
  output: release
  buildResources: public
files:
  - dist/**/*
  - electron/**/*.js
  - package.json
extraResources:
  - from: dist/renderer/launcher
    to: launcher
win:
  target: nsis
  icon: public/icon.png
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
extraMetadata:
  name: baka-tools
# Auto-update via GitHub Releases
publish:
  provider: github
  owner: starkoook
  repo: baka
